# Named rule fragments. Reference from items/sections via {$ref: "#/macros/<name>"}.
# Macros may $ref other macros (max depth 3 — see compile_settings_ui.py). No template logic.
#
# Adding a macro: define here once, then reference everywhere. The compiler
# resolves $refs into the canonical settings_ui.json output the frontend reads.

macros:
  # Most-used: only writable when the device is offroad.
  offroad:
    - {type: offroad_only}

  # Writable while not engaged (started, but selfdrive/MADS not active).
  not_engaged:
    - {type: not_engaged}

  # sunnypilot longitudinal control is active.
  longitudinal:
    - {type: capability, field: has_longitudinal_control, equals: true}

  # EITHER longitudinal control OR ICBM -- the correct gate for anything that works through the
  # cruise buttons as well as through direct longitudinal control. A bare list of rules is an AND,
  # so this needs the explicit `any`; using longitudinal_and_icbm below greyed out all 26 of this
  # fork's settings on a car that has ICBM but not alpha long, which is the owner's own car.
  longitudinal_or_icbm:
    - type: any
      conditions:
        - {type: capability, field: has_longitudinal_control, equals: true}
        - {type: capability, field: has_icbm, equals: true}

  # ICBM on. MATCHES THE DEVICE: cruise.py gates its ICBM tunables with
  # `set_enabled(ui_state.has_icbm)` -- ICBM alone, not longitudinal as well. SunnyLink must not be
  # stricter than the screen in the car, or a setting the owner can change on the bench reads as
  # UNAVAILABLE remotely, which is exactly what happened.
  icbm_enabled:
    - {type: capability, field: has_icbm, equals: true}

  # Longitudinal + ICBM BOTH available. Rarely what you want -- see longitudinal_or_icbm above.
  longitudinal_and_icbm:
    - {type: capability, field: has_longitudinal_control, equals: true}
    - {type: capability, field: has_icbm, equals: true}

  # Item only meaningful when "Show Advanced Controls" is enabled by the user.
  advanced_only:
    - {type: param, key: ShowAdvancedControls, equals: true}

  # Hide on MICI hardware (no analog HUD support yet). Visible on TICI/TIZI (device_type != mici).
  hide_on_mici:
    - type: not
      condition: {type: capability, field: device_type, equals: mici}

  # Show only on MICI (comma 4) hardware. Use for C4-specific options that have no TICI/TIZI equivalent.
  mici_only:
    - {type: capability, field: device_type, equals: mici}

  # FORD_EDGE_MK2's pinion sensor only reports a relative angle -- the safety/control
  # layers already no-op FordPrefSteerAngleCurvature there (see
  # opendbc/sunnypilot/car/ford/values_ext.py FORD_PINION_GEOMETRY_INDEX), so grey the
  # toggle out too rather than leaving a live-looking control that silently does nothing.
  not_ford_edge_mk2:
    - type: not
      condition: {type: capability, field: platform, equals: FORD_EDGE_MK2}

  # Mirrors selfdrive/ui/sunnypilot/layouts/.../mads_settings.py:_mads_limited_settings()
  # Rivian + Tesla-without-vehicle-bus get the limited MADS UI (3-toggle subset).
  # On those platforms these toggles are disabled — full MADS settings are
  # only writable on platforms NOT in the limited-set.
  mads_full_platforms:
    - type: not
      condition:
        type: any
        conditions:
          - {type: capability, field: brand, equals: rivian}
          - type: all
            conditions:
              - {type: capability, field: brand, equals: tesla}
              - type: not
                condition: {type: capability, field: tesla_has_vehicle_bus, equals: true}

  # Inverse of mads_full_platforms: present only on the limited platforms.
  # Useful for "show this only on rivian/tesla-no-bus" toggles.
  mads_limited_platforms:
    - type: any
      conditions:
        - {type: capability, field: brand, equals: rivian}
        - type: all
          conditions:
            - {type: capability, field: brand, equals: tesla}
            - type: not
              condition: {type: capability, field: tesla_has_vehicle_bus, equals: true}

  # Hide on sunnypilot release branches (is_release is hardcoded False everywhere; is_sp_release is the active gate).
  release_branches_hide:
    - type: not
      condition: {type: capability, field: is_sp_release, equals: true}
